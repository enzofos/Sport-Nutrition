<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sport & Nutrition Pro Ultimate</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1400px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}.program{border:1px solid #475569;padding:10px;margin:8px;border-radius:8px}input,select,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #475569;padding:6px}canvas{background:#fff;border-radius:8px;max-height:260px}</style></head><body><h1>🏋️ Sport & Nutrition Pro Ultimate</h1><div class=card><h2>Programmes</h2><input id=progName placeholder='Push/Pull/Legs'><button onclick='addProgram()'>Créer</button><div id=programs></div></div><div class=card><h2>📈 Progression par exercice</h2><input id=perfEx placeholder='Exercice'><input id=perfKg type=number placeholder='Charge'><input id=perfRep type=number placeholder='Répétitions'><button onclick='addPerf()'>Ajouter performance</button><div id=histPerf></div><canvas id=exerciseChart></canvas></div><div class=card><h2>📏 Suivi physique</h2><input id=d type=date><input id=p type=number placeholder='Poids'><input id=tt type=number placeholder='Tour taille'><input id=po type=number placeholder='Poitrine'><input id=bd type=number placeholder='Bras D'><input id=bg type=number placeholder='Bras G'><input id=cd type=number placeholder='Cuisse D'><input id=cg type=number placeholder='Cuisse G'><input id=mg type=number placeholder='MG %'><button onclick='addMeasure()'>Ajouter</button><div id=mesTable></div><canvas id=weightChart></canvas><canvas id=waistChart></canvas></div><div class=card><h2>⚖️ Nutrition</h2><input id=nw type=number placeholder='Poids'><input id=nh type=number placeholder='Taille'><input id=na type=number placeholder='Age'><select id=goal><option>Sèche</option><option>Maintien</option><option>Prise de muscle</option></select><button onclick='calcNutri()'>Calculer</button><div id=nutri></div></div><div class=card><button onclick='exportData()'>Exporter JSON</button><input type=file onchange='importData(event)'></div><script src='app.js'></script></body></html>
