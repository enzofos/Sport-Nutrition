<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sport & Nutrition Pro Ultimate</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Segoe UI;background:#0f172a;color:#fff;max-width:1400px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,select,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}canvas{background:#fff;border-radius:8px;max-height:300px}.program{border:1px solid #475569;padding:8px;margin:8px;border-radius:8px}</style></head><body><h1>🏋️ Sport & Nutrition Pro Ultimate</h1><div class=card><h2>Programmes</h2><input id=prog placeholder='Push/Pull/Legs'><button onclick='addProgram()'>Créer</button><div id=programs></div></div><div class=card><h2>Suivi physique</h2><input id=date type=date><input id=poids type=number placeholder='Poids'><input id=taille type=number placeholder='Tour taille'><input id=poitrine type=number placeholder='Poitrine'><input id=mg type=number placeholder='MG %'><button onclick='addMeasure()'>Ajouter</button><div id=histMes></div><canvas id=wChart></canvas><canvas id=tChart></canvas></div><div class=card><h2>Progression exercice</h2><input id=exo placeholder='Exercice'><input id=charge type=number placeholder='Charge'><input id=reps type=number placeholder='Reps'><button onclick='addPerf()'>Ajouter perf</button><div id=histPerf></div><canvas id=eChart></canvas></div><div class=card><h2>Nutrition</h2><input id=np type=number placeholder='Poids'><input id=nt type=number placeholder='Taille'><input id=na type=number placeholder='Age'><select id=obj><option>Sèche</option><option>Maintien</option><option>Prise de muscle</option></select><button onclick='calcNutri()'>Calculer</button><div id=nutri></div></div><script src='app.js'></script></body></html>
